# Forwarding rules shared by every domain route. Include after `set $<domain>_api ...;`.

# General API budget for every routed request (the gateway's own /health is not limited).
limit_req zone=api_per_ip burst=50 nodelay;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Identity is never taken from the caller: owners derive it from the validated token.
proxy_set_header X-User-Id "";
proxy_set_header X-User-Role "";
proxy_set_header X-User-Roles "";
proxy_set_header X-User-Permissions "";

# The gateway sets these itself; drop upstream copies so each appears once.
proxy_hide_header X-Correlation-Id;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Expose-Headers;

proxy_connect_timeout 2s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
