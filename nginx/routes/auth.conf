# Auth (dlc-iam-api). Public entry points are `security: []` in the contract; everything else
# under /api/v1/auth is protected. refresh, logout and csrf use the refresh cookie and CSRF proof.
location = /api/v1/auth/login {
  limit_req zone=login_per_ip burst=9 nodelay;
  set $iam_api http://iam-api:8080;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $iam_api;
}

location ~ ^/api/v1/auth/(email-verifications|password-recovery-requests|password-resets|jwks|refresh|logout|csrf)$ {
  set $iam_api http://iam-api:8080;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $iam_api;
}

location ~ ^/api/v1/auth(/|$) {
  include /etc/nginx/snippets/require-credential.conf;
  set $iam_api http://iam-api:8080;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $iam_api;
}
