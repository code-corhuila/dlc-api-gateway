# Clinical (dlc-clinical-api): records, entries, treatments, procedures, care closures and analytics.
location ~ ^/api/v1/(clinical-records|clinical-entries|treatments|procedures|care-closures|clinical-analytics)(/|$) {
  include /etc/nginx/snippets/require-credential.conf;
  set $clinical_api http://clinical-api:8080;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $clinical_api;
}
