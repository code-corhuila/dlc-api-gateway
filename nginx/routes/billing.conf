# Billing (dlc-billing-api): prices, billable items, invoices and manual charges.
location ~ ^/api/v1/(procedure-prices|additional-price-rules|billable-items|invoices|manual-charges|encounter-accounts)(/|$) {
  include /etc/nginx/snippets/require-credential.conf;
  set $billing_api http://billing-api:8080;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $billing_api;
}
