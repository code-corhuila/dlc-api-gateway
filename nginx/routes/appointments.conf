# Appointments (dlc-appointments-api): appointments, dentist availability and clinical assignments.
location ~ ^/api/v1/(appointments|dentists|clinical-assignments|waiting-list-entries|appointment-types)(/|$) {
  include /etc/nginx/snippets/require-credential.conf;
  set $appointments_api http://appointments-api:8080;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $appointments_api;
}
