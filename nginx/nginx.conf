# Global settings of the Di Lucca API Gateway (Annex F): JSON access log with correlationId,
# request body limit and inclusion of conf.d/. Routes live in routes/, one file per domain.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  # Bodies of the owner APIs are small JSON documents.
  client_max_body_size 1m;

  # One JSON line per request. Never log Authorization, cookies, query strings or bodies.
  log_format gateway_json escape=json
    '{"time":"$time_iso8601",'
    '"correlationId":"$request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"durationSeconds":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstreamStatus":"$upstream_status"}';
  access_log /dev/stdout gateway_json;

  include /etc/nginx/conf.d/*.conf;
}
