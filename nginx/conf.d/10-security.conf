# Edge controls shared by every route (Norma 5.6, Annex F).
# Rendered at container start by the nginx image (envsubst): ${GATEWAY_ALLOWED_ORIGIN} comes from the environment.

# X-Correlation-Id: reuse a well-formed client value, otherwise generate one. The pattern keeps
# arbitrary text (spaces, quotes, control characters) out of logs and upstream headers.
map $http_x_correlation_id $correlation_id {
  default $request_id;
  "~^[A-Za-z0-9._:-]{8,128}$" $http_x_correlation_id;
}

# CORS: only the origin of the dlc-front container (Norma 5.6.4). Any other origin gets an empty
# value, and NGINX omits a header whose value is empty. Never "*" and never credentials.
map $http_origin $cors_allow_origin {
  default "";
  "${GATEWAY_ALLOWED_ORIGIN}" $http_origin;
}

map $cors_allow_origin $cors_expose_headers {
  "" "";
  default "X-Correlation-Id, Location";
}

map $cors_allow_origin $cors_allow_headers {
  "" "";
  default "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id";
}

map $cors_allow_origin $cors_allow_methods {
  "" "";
  default "GET, POST, PUT, PATCH, DELETE, OPTIONS";
}

map $cors_allow_origin $cors_max_age {
  "" "";
  default "600";
}

# Credential presence filter (Norma 5.6.2): the gateway only checks that Authorization is
# present on protected routes. Signature, expiration and claims are validated by each owner.
map $http_authorization $credential_missing {
  "" 1;
  default 0;
}

# Rate limits per client IP, configured explicitly (Norma 5.6). Exceeding one answers
# 429 TOO_MANY_REQUESTS with the envelope and Retry-After (20-server.conf).
# Login: 10 attempts per IP in five minutes (2 per minute, first 10 at once).
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=2r/m;
# General API: 100 requests per minute per IP with a burst of 50.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/m;
limit_req_status 429;
limit_req_log_level warn;

# Client address behind dlc-front. Only the trusted proxy (${GATEWAY_TRUSTED_PROXY}, an address or
# CIDR on the platform network) may state the browser address in X-Forwarded-For; from anyone else
# the header is ignored. Rate limits and logs then see the browser, not the front container.
set_real_ip_from ${GATEWAY_TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
real_ip_recursive on;
