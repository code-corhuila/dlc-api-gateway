# The gateway server: its own errors use the common envelope; routes come from routes/*.conf.
server {
  listen 8080;
  server_name _;

  include /etc/nginx/snippets/headers.conf;

  # CORS preflight answers here, before any route: 204 with the allowed headers for the
  # container origin; other origins get 204 without Access-Control-Allow-Origin.
  if ($request_method = OPTIONS) {
    return 204;
  }

  include /etc/nginx/routes/*.conf;

  # Anything not routed, including /internal/v1, is unknown to the gateway.
  location / {
    return 404;
  }

  error_page 401 @unauthorized;
  error_page 404 @not_found;
  error_page 429 @too_many_requests;
  # The upstream did not answer (stopped, unresolvable or timed out). Errors an owner returns
  # itself pass through untouched because proxy_intercept_errors stays off.
  error_page 502 503 504 =503 @service_unavailable;

  location @unauthorized {
    include /etc/nginx/snippets/headers.conf;
    add_header WWW-Authenticate "Bearer" always;
    default_type application/json;
    return 401 '{"error":"UNAUTHORIZED","message":"Authentication is required.","traceId":"$correlation_id"}';
  }

  location @not_found {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"The requested route does not exist.","traceId":"$correlation_id"}';
  }

  location @too_many_requests {
    include /etc/nginx/snippets/headers.conf;
    add_header Retry-After "60" always;
    default_type application/json;
    return 429 '{"error":"TOO_MANY_REQUESTS","message":"Too many requests. Retry later.","traceId":"$correlation_id"}';
  }

  location @service_unavailable {
    default_type application/json;
    return 503 '{"error":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable.","traceId":"$correlation_id"}';
  }
}
