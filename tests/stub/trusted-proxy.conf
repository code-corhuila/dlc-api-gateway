# Stand-in for the dlc-front container: a trusted reverse proxy in front of the gateway.
# X-Test-Client-Ip plays the browser address the real front would put in X-Forwarded-For.
server {
  listen 8080;
  location / {
    proxy_pass http://api-gateway:8080;
    proxy_set_header X-Forwarded-For $http_x_test_client_ip;
  }
}
